name: Daily Morning News Pipeline

on:
  schedule:
    # 主触发：UTC 04:23 (芬兰冬令时 06:23) - 避开所有 0 和 5 结尾的高峰分钟
    - cron: '23 4 * * *'
    # 备用触发：UTC 04:43 (芬兰冬令时 06:43) - 双重保险容灾（若主触发被 GitHub 漏掉，自动补刀）
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch even if today was already sent'
        type: boolean
        required: false
        default: false

concurrency:
  group: morning-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Run Morning News Pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://XuliangWang-econ.github.io/morningnews' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python src/main.py --force
          else
            python src/main.py
          fi

      - name: Deploy to GitHub Pages (gh-pages)
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Pipeline Failure Summary
        if: failure()
        run: |
          echo "### ⚠️ Morning News Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "The automated morning news run encountered an error. Please inspect the workflow run logs." >> $GITHUB_STEP_SUMMARY
