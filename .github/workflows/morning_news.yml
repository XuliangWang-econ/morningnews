name: Daily Morning News Pipeline

on:
  schedule:
    # 主触发：UTC 04:23 (芬兰冬令时 06:23) - 避开所有 0 和 5 结尾的高峰分钟
    - cron: '23 4 * * *'
    # 备用触发：UTC 04:43 (芬兰冬令时 06:43) - 双重保险容灾（若主触发被 GitHub 漏掉，自动补刀）
    - cron: '43 4 * * *'
  workflow_dispatch: # 支持网页手动点击随时强制运行

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning News Pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # 如果是手动网页点击，加上 --force 参数强制重新生成
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python src/main.py --force
          else
            python src/main.py
          fi

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
